!
hostname ACC-A-01
!
aaa new-model
aaa authentication login DEFAUT group radius local
aaa authorization exec DEFAUT group radius local
aaa accounting exec DEFAUT start-stop group radius
!
username secours privilege 15 secret <secret-password>
!
ip dhcp snooping
ip dhcp snooping vlan 20,21,25,30,31,40,50,51
ip arp inspection vlan 20,21,25
!
interface GigabitEthernet0/1
 description Uplink to CC-A
 ip dhcp snooping trust
 ip arp inspection trust
!
interface FastEthernet0/2
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree bpduguard enable
 storm-control broadcast level 1.00
!
interface FastEthernet0/3
 switchport mode access
 switchport access vlan 25
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree bpduguard enable
 storm-control broadcast level 1.00
!
interface range FastEthernet0/20 - 24
 description Unused port
 switchport access vlan 99
 shutdown
!
ip domain-name atlas.local
ip ssh version 2
!
passive-interface default
!
line vty 0 4
 access-class ADMIN in
 exec-timeout 10 0
 login authentication DEFAUT
 transport input ssh
